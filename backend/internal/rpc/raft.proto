syntax = "proto3";

package raft;

option go_package = "github.com/jamesmartin6/quorum/backend/internal/rpc";

// Raft is the inter-node consensus RPC service: leader election and log
// replication, per the Raft paper (Ongaro & Ousterhout).
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  string op = 3;    // "SET" | "DELETE" | "NOOP"
  string key = 4;
  string value = 5;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // conflict_index/conflict_term let the leader jump nextIndex back
  // efficiently on a log mismatch instead of decrementing by one each RPC.
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
}
